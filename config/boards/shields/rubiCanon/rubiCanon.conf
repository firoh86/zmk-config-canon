########################################
# Bluetooth
########################################
CONFIG_ZMK_BLE=y
# Aumenta la potencia de transmisión BLE a +8 dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Mejora la estabilidad de conexión (recomendado por ZMK ante desconexiones)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

########################################
# Ahorro de energía
########################################
# Desactiva el modo de suspensión automática
CONFIG_ZMK_SLEEP=n

########################################
# Encoders (EC11)
########################################
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
